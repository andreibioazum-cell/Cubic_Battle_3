name: Build_Cubic_Battle_Android_Release_Unsigned

on:
  push:
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apk-name: ${{ steps.set-output.outputs.apk-name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ndk-gradle-v6
          restore-keys: |
            ndk-gradle-v6

      - name: Install NDK (if not cached)
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/25.2.9519653" ]; then
            yes | sdkmanager "ndk;25.2.9519653"
          fi

      - name: Export NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: love-android
          key: love-android-src-v6
          restore-keys: |
            love-android-src-v6

      - name: Clone love-android (shallow)
        run: |
          if [ ! -f "love-android/gradlew" ]; then
            git clone --depth 1 --recursive https://github.com/love2d/love-android.git
          fi

      - name: Configure app
        run: |
          sed -i 's/applicationId "org.love2d.android"/applicationId "com.CB3"/g' love-android/app/build.gradle
          sed -i '/abiFilters/d' love-android/app/build.gradle
          sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' love-android/app/build.gradle
          
          cat >> love-android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.enableJetifier=false
          android.useAndroidX=true
          EOF

      - name: Package game.love (fast)
        run: |
          zip -9 -r game.love . -x "*.git*" -x ".github/*" -x "love-android/*" -x "*.yml" -x "*.md"

      - name: Embed game
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Fast build (skip tests, only arm64)
        working-directory: love-android
        run: |
          ./gradlew assembleEmbedNoRecordRelease \
            --no-daemon \
            --parallel \
            --console=plain \
            -x test \
            -x lint \
            -x lintVitalRelease

      - name: Collect APK
        id: set-output
        run: |
          APK=$(find love-android -name "*.apk" | head -1)
          APK_NAME="CubicBattle3_$(date +'%Y%m%d_%H%M').apk"
          cp "$APK" "$APK_NAME"
          echo "apk-name=$APK_NAME" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: CubicBattle3_APK
          path: CubicBattle3_*.apk
          compression-level: 0
